name: cyber snake

on:
  schedule:
    - cron: "27 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cyber-snake.yml"

concurrency:
  group: cyber-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate cyber contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: joaodiniz99
          outputs: |
            dist/cyber-snake.svg?palette=github-dark&color_snake=#4aff8a&color_dots=#0a0a0f,#16161e,#2a2a36,#5a5a70,#e2e2e8
            dist/cyber-snake-dark.svg?palette=github-dark&color_snake=#4aff8a&color_dots=#0a0a0f,#16161e,#2a2a36,#5a5a70,#e2e2e8

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
