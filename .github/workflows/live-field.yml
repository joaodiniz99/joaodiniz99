name: live-field

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate-live-field.mjs"
      - ".github/workflows/live-field.yml"

concurrency:
  group: live-field
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Bot commits must be able to push back to main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate live-field.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-live-field.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/live-field.svg
          if git diff --staged --quiet; then
            echo "No changes to live-field.svg"
            exit 0
          fi
          git commit -m "chore: refresh live contribution field"
          # Race-safe push: rebase onto latest main and retry once
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $i) — rebasing and retrying"
            git pull --rebase origin main
          done
          exit 1
