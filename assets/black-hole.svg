<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="ASCII black hole — Gargantua silhouette">
  <defs>
    <style>
      <![CDATA[
        .bh {
          font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
          font-size: 10.5px;
          font-weight: 500;
          letter-spacing: 0;
          white-space: pre;
        }
        @keyframes twinkle {
          0%, 100% { opacity: 0.18; }
          35% { opacity: 0.88; }
          70% { opacity: 0.32; }
        }
        @keyframes twinkle-soft {
          0%, 100% { opacity: 0.1; }
          50% { opacity: 0.48; }
        }
        @keyframes photon-breathe {
          0%, 100% { opacity: 0.68; }
          50% { opacity: 1; }
        }
        @keyframes disk-flow-a {
          0%, 100% { opacity: 0.55; }
          50% { opacity: 0.98; }
        }
        @keyframes disk-flow-b {
          0%, 100% { opacity: 0.72; }
          33% { opacity: 1; }
          66% { opacity: 0.42; }
        }
        @keyframes disk-flow-c {
          0%, 100% { opacity: 0.88; }
          50% { opacity: 0.48; }
        }
        @keyframes disk-flow-d {
          0%, 100% { opacity: 0.4; }
          40% { opacity: 0.92; }
          80% { opacity: 0.55; }
        }
        @keyframes doppler-pulse {
          0%, 100% { opacity: 0.9; }
          50% { opacity: 1; }
        }
        @keyframes recede-dim {
          0%, 100% { opacity: 0.36; }
          50% { opacity: 0.55; }
        }
        @keyframes arc-shimmer {
          0%, 100% { opacity: 0.46; }
          50% { opacity: 0.88; }
        }
        .star-a { animation: twinkle 5.2s ease-in-out infinite; }
        .star-b { animation: twinkle 7.1s ease-in-out 1.4s infinite; }
        .star-c { animation: twinkle-soft 6.4s ease-in-out 0.8s infinite; }
        .star-d { animation: twinkle 8.3s ease-in-out 2.2s infinite; }
        .star-e { animation: twinkle-soft 4.8s ease-in-out 0.3s infinite; }
        .photon { animation: photon-breathe 6.5s ease-in-out infinite; }
        .flow-a { animation: disk-flow-a 4.2s ease-in-out infinite; }
        .flow-b { animation: disk-flow-b 3.6s ease-in-out 0.5s infinite; }
        .flow-c { animation: disk-flow-c 5.1s ease-in-out 1.1s infinite; }
        .flow-d { animation: disk-flow-d 4.8s ease-in-out 0.2s infinite; }
        .doppler { animation: doppler-pulse 3.8s ease-in-out infinite; }
        .recede { animation: recede-dim 5.4s ease-in-out 0.9s infinite; }
        .arc-hi { animation: arc-shimmer 7.2s ease-in-out infinite; }
        .arc-lo { animation: arc-shimmer 8.0s ease-in-out 1.6s infinite; }
      ]]>
    </style>
  </defs>

  <rect width="1200" height="380" fill="#0a0a0f" rx="10"/>
