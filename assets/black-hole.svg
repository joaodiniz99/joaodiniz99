<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="ASCII black hole — Gargantua">
  <defs>
    <style>
      <![CDATA[
        .bh {
          font-family: "Courier New", Courier, ui-monospace, monospace;
          font-size: 11.5px;
          font-weight: 500;
          letter-spacing: 0;
          white-space: pre;
        }
        @keyframes twinkle {
          0%, 100% { opacity: 0.2; }
          40% { opacity: 0.9; }
          70% { opacity: 0.35; }
        }
        @keyframes disk-pulse {
          0%, 100% { opacity: 0.88; }
          50% { opacity: 1; }
        }
        .star-a { animation: twinkle 5.4s ease-in-out infinite; }
        .star-b { animation: twinkle 7.2s ease-in-out 1.3s infinite; }
        .star-c { animation: twinkle 6.1s ease-in-out 0.6s infinite; }
        .disk-art { animation: disk-pulse 8s ease-in-out infinite; }
      ]]>
    </style>
  </defs>

  <rect width="1200" height="400" fill="#0a0a0f" rx="10"/>

  <g class="bh" xml:space="preserve">
    <text class="star-a" x="48" y="28" fill="#8a8a9a">*</text>
