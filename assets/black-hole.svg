<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="ASCII black hole — Gargantua silhouette">
  <defs>
    <style>
      <![CDATA[
        .bh {
          font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
          font-size: 9px;
          font-weight: 500;
          letter-spacing: 0;
          white-space: pre;
        }
        @keyframes twinkle {
          0%, 100% { opacity: 0.18; }
          40% { opacity: 0.85; }
          70% { opacity: 0.3; }
        }
        @keyframes disk-shimmer-a {
          0%, 100% { opacity: 0.75; }
          50% { opacity: 1; }
        }
        @keyframes disk-shimmer-b {
          0%, 100% { opacity: 0.92; }
          50% { opacity: 0.58; }
        }
        @keyframes photon-breathe {
          0%, 100% { opacity: 0.8; }
          50% { opacity: 1; }
        }
        .star-a { animation: twinkle 5.4s ease-in-out infinite; }
        .star-b { animation: twinkle 7.2s ease-in-out 1.3s infinite; }
        .star-c { animation: twinkle 6.1s ease-in-out 0.6s infinite; }
        .disk-a { animation: disk-shimmer-a 4.8s ease-in-out infinite; }
        .disk-b { animation: disk-shimmer-b 5.6s ease-in-out 0.8s infinite; }
        .photon { animation: photon-breathe 7s ease-in-out infinite; }
      ]]>
    </style>
  </defs>

  <rect width="1200" height="420" fill="#0a0a0f" rx="10"/>

  <g class="bh" xml:space="preserve">
    <text class="star-a" x="40" y="30" fill="#c8c8d4">.</text>
    <text class="star-b" x="105" y="48" fill="#8888a0">*</text>
    <text class="star-c" x="185" y="36" fill="#5a5a70">·</text>
    <text class="star-a" x="265" y="54" fill="#5a5a70">.</text>
    <text class="star-b" x="930" y="40" fill="#8888a0">*</text>
    <text class="star-c" x="1010" y="56" fill="#5a5a70">.</text>
    <text class="star-a" x="1090" y="34" fill="#c8c8d4">·</text>
    <text class="star-b" x="1155" y="50" fill="#5a5a70">*</text>
    <text class="star-c" x="50" y="385" fill="#5a5a70">.</text>
    <text class="star-a" x="135" y="400" fill="#8888a0">*</text>
    <text class="star-b" x="990" y="390" fill="#5a5a70">·</text>
    <text class="star-c" x="1110" y="402" fill="#c8c8d4">.</text>
    <text class="star-a" x="28" y="195" fill="#5a5a70">*</text>
    <text class="star-b" x="1172" y="225" fill="#8888a0">.</text>
  </g>

  <text class="bh" x="600" y="81" text-anchor="middle" xml:space="preserve">
    <tspan x="600" dy="0" fill="#5a5a70">           .   *         .                      *               .        *      .           </tspan>
    <tspan x="600" dy="11" fill="#5a5a70">                    .              *                       .                 *              </tspan>
    <tspan x="600" dy="11" fill="#c4a574">                                 ....::::++++####%%%%####++++::::....                       </tspan>
    <tspan x="600" dy="11" fill="#c4a574">                             ..::+++###***::::::::::::::***###+++::..                       </tspan>
    <tspan x="600" dy="11" fill="#a89b86">                        .::++##**::..                    ..::**##++::.                      </tspan>
    <tspan x="600" dy="11" fill="#a89b86">                       .:+#*::.                              .::*#+:.                       </tspan>
    <tspan x="600" dy="11" fill="#a89b86">                       :+#*:                                    :*#+:                       </tspan>
    <tspan x="600" dy="11" class="photon" fill="#e8e0d4">                     :#*:         ..::++**########**++::..         :*#:                     </tspan>
    <tspan x="600" dy="11" class="photon" fill="#e8e0d4">                     #:.        .::+*##@%%::::::::%%@##*+::.        .:#                     </tspan>
    <tspan x="600" dy="11" class="photon" fill="#e8e0d4">                    *:       .:+*#@*:..    ......    ..:*@#*+:.       :*                    </tspan>
    <tspan x="600" dy="11" class="photon" fill="#e8e0d4">                    *:      :+#@*:     ..:++####++:..     :*@#+:      :*                    </tspan>
    <tspan x="600" dy="11" class="photon" fill="#e8e0d4">                    ·      :*@#:     .:+##        ##+:.     :#@*:      ·                    </tspan>
    <tspan x="600" dy="11" class="disk-a" fill="#c4a574">             %%%%%%#####@@@@@####**++::..            ..::++**ooOO@@@@####**+::.             </tspan>
    <tspan x="600" dy="11" class="disk-b" fill="#e8e0d4">             %%%%%%%%########@@@@@@@@####              ####@@@@OOOO****++++::::             </tspan>
    <tspan x="600" dy="11" class="disk-a" fill="#b5a68e">             %%%%%%#####@@@@@####**++::..            ..::++**ooOO@@@@####**+::.             </tspan>
    <tspan x="600" dy="11" class="photon" fill="#e8e0d4">                    ·      :*@#:     ':+##        ##+:'     :#@*:      ·                    </tspan>
    <tspan x="600" dy="11" class="photon" fill="#e8e0d4">                     *:      :+#@*:     ''::++++::''     :*@#+:      :*                     </tspan>
    <tspan x="600" dy="11" class="photon" fill="#e8e0d4">                    *:       .:+*#@*:..    ......    ..:*@#*+:.       :*                    </tspan>
    <tspan x="600" dy="11" class="photon" fill="#e8e0d4">                    #:.        '.::+*##@%%::::::::%%@##*+::.'        .:#                    </tspan>
    <tspan x="600" dy="11" class="photon" fill="#e8e0d4">                     :#*:         ''::++**########**++::''         :*#:                     </tspan>
    <tspan x="600" dy="11" fill="#a89b86">                       :+#*:                                    :*#+:                       </tspan>
    <tspan x="600" dy="11" fill="#a89b86">                       .:+#*::.                              .::*#+:.                       </tspan>
    <tspan x="600" dy="11" fill="#a89b86">                        .::++##**::..                    ..::**##++::.                      </tspan>
    <tspan x="600" dy="11" fill="#a89b86">                            '..::+++###***::::::::::::::***###+++::..'                      </tspan>
    <tspan x="600" dy="11" fill="#c4a574">                             ''''....::::++++####%%%%####++++::::....''''                   </tspan>
    <tspan x="600" dy="11" fill="#5a5a70">           .   *         .                      *               .        *      .           </tspan>
  </text>
</svg>
