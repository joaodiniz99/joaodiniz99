<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="João Dumas Diniz — LIVE · BUILDING">
  <defs>
    <radialGradient id="glowA" cx="22%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#4a9eff" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#4a9eff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4a9eff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="78%" cy="62%" r="38%">
      <stop offset="0%" stop-color="#4aff8a" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#4aff8a" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#4aff8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="52%" cy="18%" r="28%">
      <stop offset="0%" stop-color="#4a9eff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4a9eff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a9eff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#4a9eff" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#4aff8a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4aff8a" stop-opacity="0"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <style>
      <![CDATA[
        .drift-a { animation: driftA 14s ease-in-out infinite; }
        .drift-b { animation: driftB 18s ease-in-out infinite; }
        .drift-c { animation: driftC 12s ease-in-out infinite; }
        .signal { stroke-dasharray: 8 14; animation: dash 6s linear infinite; }
        .signal-slow { stroke-dasharray: 4 18; animation: dash 10s linear infinite reverse; }
        .pulse-dot { animation: pulse 2.2s ease-in-out infinite; }
        .pulse-ring { animation: ring 2.2s ease-in-out infinite; transform-origin: 928px 68px; }
        .chip-glow { animation: chipGlow 2.2s ease-in-out infinite; }
        @keyframes driftA {
          0%, 100% { transform: translate(0, 0); opacity: 1; }
          50% { transform: translate(40px, 18px); opacity: 0.85; }
        }
        @keyframes driftB {
          0%, 100% { transform: translate(0, 0); opacity: 1; }
          50% { transform: translate(-36px, -14px); opacity: 0.8; }
        }
        @keyframes driftC {
          0%, 100% { transform: translate(0, 0); }
          50% { transform: translate(18px, 28px); }
        }
        @keyframes dash {
          to { stroke-dashoffset: -120; }
        }
        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.55; }
        }
        @keyframes ring {
          0% { opacity: 0.7; transform: scale(0.7); }
          70% { opacity: 0; transform: scale(1.8); }
          100% { opacity: 0; transform: scale(1.8); }
        }
        @keyframes chipGlow {
          0%, 100% { opacity: 0.9; }
          50% { opacity: 1; }
        }
      ]]>
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="#0a0a0f"/>

  <!-- Soft drifting radial glows -->
  <g filter="url(#softBlur)">
    <circle class="drift-a" cx="260" cy="120" r="160" fill="url(#glowA)"/>
    <circle class="drift-b" cx="920" cy="200" r="150" fill="url(#glowB)"/>
    <circle class="drift-c" cx="620" cy="60" r="110" fill="url(#glowC)"/>
  </g>

  <!-- Subtle grid of nodes (constellation) -->
  <g opacity="0.55" fill="#4a9eff">
    <circle cx="120" cy="80" r="2.2" opacity="0.7"/>
    <circle cx="210" cy="140" r="1.8" opacity="0.5"/>
    <circle cx="340" cy="60" r="2" opacity="0.6"/>
    <circle cx="480" cy="180" r="1.6" opacity="0.45"/>
    <circle cx="620" cy="110" r="2.2" opacity="0.65"/>
    <circle cx="760" cy="200" r="1.8" opacity="0.5"/>
    <circle cx="880" cy="90" r="2" opacity="0.55"/>
    <circle cx="1040" cy="160" r="1.7" opacity="0.4"/>
    <circle cx="180" cy="230" r="1.5" opacity="0.4"/>
    <circle cx="420" cy="250" r="1.8" opacity="0.45"/>
    <circle cx="700" cy="260" r="1.6" opacity="0.4"/>
    <circle cx="980" cy="240" r="2" opacity="0.5"/>
  </g>
  <g opacity="0.4" fill="#4aff8a">
    <circle cx="300" cy="200" r="1.5"/>
    <circle cx="540" cy="70" r="1.6"/>
    <circle cx="820" cy="150" r="1.4"/>
    <circle cx="150" cy="160" r="1.3"/>
  </g>

  <!-- Signal / constellation lines with dash animation -->
  <g fill="none" stroke="url(#lineGrad)" stroke-width="1.2" stroke-linecap="round">
    <path class="signal" d="M120 80 L210 140 L340 60 L480 180 L620 110"/>
    <path class="signal-slow" d="M620 110 L760 200 L880 90 L1040 160"/>
    <path class="signal" d="M180 230 L300 200 L420 250 L540 70 L700 260"/>
    <path class="signal-slow" d="M210 140 L300 200 L480 180 L700 260 L980 240"/>
    <path class="signal" d="M340 60 L540 70 L820 150 L880 90" opacity="0.7"/>
  </g>

  <!-- Accent hairlines -->
  <line x1="0" y1="1" x2="1200" y2="1" stroke="#4a9eff" stroke-opacity="0.15" stroke-width="2"/>
  <line x1="0" y1="319" x2="1200" y2="319" stroke="#4aff8a" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Copy -->
  <text x="72" y="92" fill="#4a9eff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" letter-spacing="4" font-weight="600">LIVE · BUILDING</text>

  <text x="72" y="160" fill="#e8eaf0" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-0.5">João Dumas Diniz</text>

  <text x="72" y="208" fill="#9aa0b4" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" letter-spacing="1.2">full-stack  ·  agents  ·  systems that stay sharp</text>

  <!-- Status chip -->
  <g class="chip-glow">
    <rect x="900" y="48" width="228" height="40" rx="20" fill="#12121a" stroke="#4aff8a" stroke-opacity="0.35" stroke-width="1"/>
    <circle class="pulse-ring" cx="928" cy="68" r="8" fill="none" stroke="#4aff8a" stroke-width="1.5"/>
    <circle class="pulse-dot" cx="928" cy="68" r="4.5" fill="#4aff8a"/>
    <text x="948" y="73" fill="#c8f5d8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" letter-spacing="0.8">online · shipping</text>
  </g>
</svg>
