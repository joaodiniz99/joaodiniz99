<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="João Dumas Diniz — SWE · agents · systems that stay sharp">
  <defs>
    <style>
      <![CDATA[
        .pulse-dot { animation: pulse 2.2s ease-in-out infinite; }
        .pulse-ring { animation: ring 2.2s ease-in-out infinite; transform-origin: 96px 232px; }
        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.5; }
        }
        @keyframes ring {
          0% { opacity: 0.55; transform: scale(0.7); }
          70% { opacity: 0; transform: scale(1.75); }
          100% { opacity: 0; transform: scale(1.75); }
        }
      ]]>
    </style>
  </defs>

  <!-- Flat dark base — no glows, no colored orbs -->
  <rect width="1200" height="320" fill="#0a0a0f"/>

  <!-- Hairlines -->
  <line x1="0" y1="1" x2="1200" y2="1" stroke="#e2e2e8" stroke-opacity="0.08" stroke-width="2"/>
  <line x1="0" y1="319" x2="1200" y2="319" stroke="#e2e2e8" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Identity (left) — single status via chip; no LIVE · BUILDING -->
  <text x="72" y="132" fill="#e2e2e8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-0.5">João Dumas Diniz</text>

  <text x="72" y="176" fill="#8888a0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" letter-spacing="1.1">SWE  ·  agents  ·  systems that stay sharp</text>

  <!-- Status chip (only status indicator) -->
