    <circle class="pulse-dot" cx="96" cy="232" r="4.2" fill="#e2e2e8"/>
    <text x="116" y="237" fill="#c8c8d4" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" letter-spacing="0.8">online · shipping</text>
  </g>

