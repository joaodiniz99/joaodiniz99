<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="João Dumas Diniz — SWE · agents · systems that stay sharp">
  <defs>
    <style>
      <![CDATA[
        .pulse-dot { animation: pulse 2.2s ease-in-out infinite; }
        .pulse-ring { animation: ring 2.2s ease-in-out infinite; transform-origin: 96px 232px; }
        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.5; }
        }
        @keyframes ring {
          0% { opacity: 0.55; transform: scale(0.7); }
          70% { opacity: 0; transform: scale(1.75); }
          100% { opacity: 0; transform: scale(1.75); }
        }
      ]]>
    </style>
  </defs>

  <!-- Flat dark base — no glows, no colored orbs -->
  <rect width="1200" height="320" fill="#0a0a0f"/>

  <!-- Monochrome constellation (subtle structure only) -->
  <g opacity="0.35" fill="#5a5a70">
    <circle cx="560" cy="48" r="1.6"/>
    <circle cx="700" cy="36" r="1.3"/>
    <circle cx="840" cy="52" r="1.5"/>
    <circle cx="980" cy="40" r="1.2"/>
    <circle cx="1120" cy="70" r="1.4"/>
    <circle cx="640" cy="280" r="1.3"/>
    <circle cx="900" cy="290" r="1.2"/>
    <circle cx="1080" cy="270" r="1.4"/>
  </g>
  <g fill="none" stroke="#5a5a70" stroke-opacity="0.28" stroke-width="1" stroke-linecap="round">
    <path d="M560 48 L700 36 L840 52 L980 40 L1120 70"/>
    <path d="M640 280 L900 290 L1080 270" opacity="0.7"/>
    <path d="M700 36 L640 280" opacity="0.35"/>
    <path d="M980 40 L900 290" opacity="0.3"/>
  </g>

  <!-- Hairlines -->
  <line x1="0" y1="1" x2="1200" y2="1" stroke="#e2e2e8" stroke-opacity="0.08" stroke-width="2"/>
  <line x1="0" y1="319" x2="1200" y2="319" stroke="#e2e2e8" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Identity (left) — single status via chip; no LIVE · BUILDING -->
  <text x="72" y="132" fill="#e2e2e8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-0.5">João Dumas Diniz</text>

  <text x="72" y="176" fill="#8888a0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" letter-spacing="1.1">SWE  ·  agents  ·  systems that stay sharp</text>

  <!-- Status chip (only status indicator) -->
  <g>
    <rect x="72" y="212" width="212" height="40" rx="20" fill="#12121a" stroke="#5a5a70" stroke-opacity="0.7" stroke-width="1"/>
    <circle class="pulse-ring" cx="96" cy="232" r="8" fill="none" stroke="#e2e2e8" stroke-opacity="0.45" stroke-width="1.4"/>
    <circle class="pulse-dot" cx="96" cy="232" r="4.2" fill="#e2e2e8"/>
    <text x="116" y="237" fill="#c8c8d4" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" letter-spacing="0.8">online · shipping</text>
  </g>

  <!-- ========== Stack icons — 10 equal tiles, 2×5 ========== -->
  <!-- Palette: #e2e2e8 / #8888a0 / #5a5a70 only. Columns: 620 710 800 890 980 -->

  <!-- Row 1: AI · SWE · TypeScript · Bun · PHP -->

  <!-- AI — text mark -->
  <g transform="translate(620, 36)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="7s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="52" height="52" rx="14" fill="#12121a" stroke="#5a5a70" stroke-width="1.1"/>
      <text x="26" y="33" text-anchor="middle" fill="#e2e2e8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="1.5">AI</text>
      <text x="26" y="68" text-anchor="middle" fill="#8888a0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" letter-spacing="1.4">AI</text>
    </g>
  </g>

  <!-- SWE — text mark -->
  <g transform="translate(710, 36)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="8.2s" begin="0.6s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="52" height="52" rx="14" fill="#12121a" stroke="#5a5a70" stroke-width="1.1"/>
      <text x="26" y="33" text-anchor="middle" fill="#e2e2e8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="0.8">SWE</text>
      <text x="26" y="68" text-anchor="middle" fill="#8888a0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" letter-spacing="1.4">SWE</text>
    </g>
  </g>

  <!-- TypeScript — official badge shape -->
  <g transform="translate(800, 36)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="6.5s" begin="1.1s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="52" height="52" rx="14" fill="#12121a" stroke="#5a5a70" stroke-width="1.1"/>
      <rect x="8" y="8" width="36" height="36" rx="7" fill="#e2e2e8"/>
      <text x="26" y="33" text-anchor="middle" fill="#0a0a0f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="-0.4">TS</text>
      <text x="26" y="68" text-anchor="middle" fill="#8888a0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" letter-spacing="0.3">TypeScript</text>
    </g>
  </g>

  <!-- Bun — simplified mono face -->
  <g transform="translate(890, 36)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="7.6s" begin="0.3s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="52" height="52" rx="14" fill="#12121a" stroke="#5a5a70" stroke-width="1.1"/>
      <g transform="translate(8, 10)">
        <ellipse cx="18" cy="18" rx="15" ry="13.5" fill="#e2e2e8"/>
        <ellipse cx="18" cy="16.5" rx="11.5" ry="9.5" fill="#c8c8d4"/>
        <circle cx="12.5" cy="16.5" r="1.9" fill="#0a0a0f"/>
        <circle cx="23.5" cy="16.5" r="1.9" fill="#0a0a0f"/>
        <path d="M13.5 22 Q18 25.5 22.5 22" fill="none" stroke="#0a0a0f" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M9 5 Q10.5 1.5 12 5" fill="none" stroke="#8888a0" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M16 3.5 Q17.5 0 19 3.5" fill="none" stroke="#8888a0" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M23 5 Q24.5 1.5 26 5" fill="none" stroke="#8888a0" stroke-width="1.3" stroke-linecap="round"/>
      </g>
      <text x="26" y="68" text-anchor="middle" fill="#8888a0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" letter-spacing="1.4">Bun</text>
    </g>
  </g>

  <!-- PHP — official-style pill wordmark -->
  <g transform="translate(980, 36)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="8.8s" begin="1.5s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="52" height="52" rx="14" fill="#12121a" stroke="#5a5a70" stroke-width="1.1"/>
      <rect x="7" y="16" width="38" height="20" rx="10" fill="#e2e2e8"/>
      <text x="26" y="31" text-anchor="middle" fill="#0a0a0f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" font-style="italic" letter-spacing="0.2">php</text>
      <text x="26" y="68" text-anchor="middle" fill="#8888a0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" letter-spacing="1.4">PHP</text>
    </g>
  </g>

  <!-- Row 2: Laravel · React · Angular · Vue · Node -->

  <!-- Laravel — four-bar geometric mark (mono) -->
  <g transform="translate(620, 148)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="7.4s" begin="0.4s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="52" height="52" rx="14" fill="#12121a" stroke="#5a5a70" stroke-width="1.1"/>
      <g transform="translate(11, 11)">
        <path d="M2 6 L12 2 L15.5 9.5 L5.5 13.5 Z" fill="#e2e2e8"/>
        <path d="M14 6 L24 2 L27.5 9.5 L17.5 13.5 Z" fill="#e2e2e8" opacity="0.75"/>
        <path d="M5.5 16.5 L15.5 12.5 L19 20 L9 24 Z" fill="#8888a0"/>
        <path d="M17.5 16.5 L27.5 12.5 L31 20 L21 24 Z" fill="#8888a0" opacity="0.75"/>
      </g>
      <text x="26" y="68" text-anchor="middle" fill="#8888a0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" letter-spacing="0.3">Laravel</text>
    </g>
  </g>

  <!-- React — official atom -->
  <g transform="translate(710, 148)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="7.3s" begin="0.9s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="52" height="52" rx="14" fill="#12121a" stroke="#5a5a70" stroke-width="1.1"/>
      <g transform="translate(8, 8)" fill="none" stroke="#e2e2e8" stroke-width="1.45">
        <ellipse cx="18" cy="18" rx="15" ry="5.8"/>
        <ellipse cx="18" cy="18" rx="15" ry="5.8" transform="rotate(60 18 18)"/>
        <ellipse cx="18" cy="18" rx="15" ry="5.8" transform="rotate(120 18 18)"/>
        <circle cx="18" cy="18" r="2.6" fill="#e2e2e8" stroke="none"/>
      </g>
      <text x="26" y="68" text-anchor="middle" fill="#8888a0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" letter-spacing="0.8">React</text>
    </g>
  </g>

  <!-- Angular — official shield -->
  <g transform="translate(800, 148)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="6.8s" begin="0.2s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="52" height="52" rx="14" fill="#12121a" stroke="#5a5a70" stroke-width="1.1"/>
      <g transform="translate(10, 8)">
        <path d="M16 2 L32 8 L28.5 30 L16 37 L3.5 30 L0 8 Z" fill="#e2e2e8"/>
        <path d="M16 8 L26.5 12 L24 28 L16 33 L8 28 L5.5 12 Z" fill="#12121a" opacity="0.35"/>
        <path d="M11 26 L16 10 L21 26 H18 L16 18.5 L14 26 Z" fill="#0a0a0f"/>
      </g>
      <text x="26" y="68" text-anchor="middle" fill="#8888a0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" letter-spacing="0.4">Angular</text>
    </g>
  </g>

  <!-- Vue — official V, point DOWN (correct brand orientation) -->
  <g transform="translate(890, 148)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="8s" begin="1.3s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="52" height="52" rx="14" fill="#12121a" stroke="#5a5a70" stroke-width="1.1"/>
      <g transform="translate(10, 10)">
        <path d="M2 2 L16 30 L30 2 H23 L16 16 L9 2 Z" fill="#e2e2e8"/>
        <path d="M9 2 L16 18 L23 2 H19.5 L16 10 L12.5 2 Z" fill="#0a0a0f"/>
      </g>
      <text x="26" y="68" text-anchor="middle" fill="#8888a0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" letter-spacing="1.4">Vue</text>
    </g>
  </g>

  <!-- Node — official hexagon mark -->
  <g transform="translate(980, 148)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="7.9s" begin="0.7s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="52" height="52" rx="14" fill="#12121a" stroke="#5a5a70" stroke-width="1.1"/>
      <g transform="translate(10, 8)">
        <path d="M16 2 L30 10 V26 L16 34 L2 26 V10 Z" fill="none" stroke="#e2e2e8" stroke-width="1.9" stroke-linejoin="round"/>
        <path d="M16 8 L25 13.5 V24.5 L16 30 L7 24.5 V13.5 Z" fill="#5a5a70" opacity="0.35"/>
        <text x="16" y="22" text-anchor="middle" fill="#e2e2e8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700">js</text>
      </g>
      <text x="26" y="68" text-anchor="middle" fill="#8888a0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" letter-spacing="1">Node</text>
    </g>
  </g>
</svg>
